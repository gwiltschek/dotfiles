---
# Collections used by the playbooks. The distro "ansible" package already
# includes them; with only "ansible-core" installed, run:
#   ansible-galaxy collection install -r requirements.yml
collections:
  # 11.x is the newest series supporting ansible-core 2.16 (Ubuntu 24.04);
  # 12+ needs 2.17+. Also works on the newer cores of Ubuntu 26.04 / Debian 13.
  - name: community.general   # timezone, locale_gen, npm
    version: ">=11.0.0,<12.0.0"
  - name: ansible.posix       # authorized_key (2.x supports ansible-core 2.16+)
    version: ">=2.0.0,<3.0.0"
