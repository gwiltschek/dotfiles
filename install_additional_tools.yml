---
- name: Install additional developer tools
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Ensure Node.js/npm are available for global CLI installs
      ansible.builtin.package:
        name:
          - nodejs
          - npm
        state: present
      become: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Ensure ~/.local/bin exists for user installs
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Install additional CLI tools if they are missing
      ansible.builtin.shell: |
        set -e
        export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:/usr/local/bin:/usr/bin:$PATH"

        if ! command -v pi >/dev/null 2>&1; then
          if npm view pi version >/dev/null 2>&1; then
            npm install -g pi
          else
            echo "Skipping pi: package unavailable on npm"
          fi
        fi

        if ! command -v opencode >/dev/null 2>&1; then
          if command -v curl >/dev/null 2>&1; then
            curl -fsSL https://opencode.ai/install.sh | bash || curl -fsSL https://opencode.ai/install | bash
          else
            echo "Skipping opencode: curl is not installed"
          fi
        fi

        if ! command -v herdr >/dev/null 2>&1; then
          echo "herdr is not installed; if it is managed elsewhere in setup_environment.yml, this playbook skips it intentionally."
        fi

        if ! command -v claude >/dev/null 2>&1; then
          if npm view @anthropic-ai/claude-code version >/dev/null 2>&1; then
            npm install -g @anthropic-ai/claude-code
          else
            echo "Skipping claude: package unavailable on npm"
          fi
        fi

        if ! command -v create-t3-app >/dev/null 2>&1; then
          if npm view create-t3-app version >/dev/null 2>&1; then
            npm install -g create-t3-app
          else
            echo "Skipping create-t3-app: package unavailable on npm"
          fi
        fi

        if ! command -v antigravity >/dev/null 2>&1; then
          if npm view antigravity version >/dev/null 2>&1; then
            npm install -g antigravity
          else
            echo "Skipping antigravity: package unavailable on npm"
          fi
        fi
      register: tool_install
      changed_when: true

    - name: Show installed tool status summary
      ansible.builtin.debug:
        msg:
          - "pi: {{ 'installed' if lookup('pipe', 'command -v pi || true') else 'missing' }}"
          - "opencode: {{ 'installed' if lookup('pipe', 'command -v opencode || true') else 'missing' }}"
          - "herdr: {{ 'installed' if lookup('pipe', 'command -v herdr || true') else 'missing' }}"
          - "claude: {{ 'installed' if lookup('pipe', 'command -v claude || true') else 'missing' }}"
          - "create-t3-app: {{ 'installed' if lookup('pipe', 'command -v create-t3-app || true') else 'missing' }}"
          - "antigravity: {{ 'installed' if lookup('pipe', 'command -v antigravity || true') else 'missing' }}"
