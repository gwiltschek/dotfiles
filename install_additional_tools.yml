---
- name: Install additional developer tools
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    user_home: "{{ lookup('env', 'HOME') }}"
    local_bin: "{{ user_home }}/.local/bin"
    npm_user_prefix: "{{ user_home }}/.local"

    nodesource_major: "24"

    # Gitea CLI gt (https://gitea.com/gitea/cli), the successor of the archived tea CLI.
    gt_version: "1.1.0"
    gt_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts['architecture'], 'amd64') }}"
    gt_url: "https://gitea.com/gitea/cli/releases/download/v{{ gt_version }}/gitea-cli-{{ gt_version }}-linux-{{ gt_arch }}.xz"

    # npm packages installed by mistake in the past (they shadow or impersonate real tools)
    npm_stray_packages:
      - pi                                # prints digits of pi, shadows the pi agent binary
      - "@mariozechner/pi-coding-agent"   # deprecated, replaced by @earendil-works/pi-coding-agent
      - create-t3-app
      - antigravity

  # Every task sees user-local bin dirs, so `command -v` checks find tools installed there.
  environment:
    PATH: "{{ local_bin }}:{{ user_home }}/.opencode/bin:{{ lookup('env', 'PATH') }}"

  tasks:
    # -------------------------------------------------------------------------
    # Base packages and Node.js
    # Supported: Ubuntu 24.04, Ubuntu 26.04, Debian 13.
    # Node.js comes from NodeSource on all of them: distro nodejs is too old for
    # pi-coding-agent (needs >= 22.19) on Ubuntu 24.04 (18.19) and Debian 13 (20.19),
    # and one apt-managed version everywhere keeps apt patching in charge of updates.
    # -------------------------------------------------------------------------
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - xz-utils
          - python3-debian   # required by deb822_repository
        state: present
        update_cache: true
        cache_valid_time: 3600
      become: true

    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Remove distro npm package (conflicts with NodeSource nodejs, which bundles npm)
      ansible.builtin.apt:
        name: npm
        state: absent
      become: true
      when: "'npm' in ansible_facts.packages"

    - name: Add NodeSource repository (node {{ nodesource_major }}.x)
      ansible.builtin.deb822_repository:
        name: nodesource
        types: deb
        uris: "https://deb.nodesource.com/node_{{ nodesource_major }}.x"
        suites: nodistro
        components: main
        signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
      become: true

    - name: Prefer NodeSource nodejs over the distro package
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/nodesource
        mode: '0644'
        content: |
          Package: nodejs
          Pin: origin deb.nodesource.com
          Pin-Priority: 600
      become: true

    # state: latest so an already installed distro nodejs gets replaced
    - name: Install Node.js from NodeSource
      ansible.builtin.apt:
        name: nodejs
        state: latest
        update_cache: true
      become: true

    - name: Ensure local bin directory exists
      ansible.builtin.file:
        path: "{{ local_bin }}"
        state: directory
        mode: '0755'

    # -------------------------------------------------------------------------
    # Clean up stray npm packages in both the user-local and the system prefix
    # -------------------------------------------------------------------------
    - name: Remove stray npm packages from user-local prefix
      ansible.builtin.shell: |
        if npm ls -g --prefix "{{ npm_user_prefix }}" --depth=0 "{{ item }}" >/dev/null 2>&1; then
          npm uninstall -g --prefix "{{ npm_user_prefix }}" "{{ item }}" && echo REMOVED
        fi
      loop: "{{ npm_stray_packages }}"
      register: stray_user
      changed_when: "'REMOVED' in stray_user.stdout"

    - name: Remove stray npm packages from system prefix
      community.general.npm:
        name: "{{ item }}"
        global: true
        state: absent
      loop: "{{ npm_stray_packages }}"
      become: true

    # -------------------------------------------------------------------------
    # npm-based tools
    # -------------------------------------------------------------------------
    - name: Install pi coding agent into user-local prefix
      # https://github.com/badlogic/pi-mono. Check where "pi" resolves, since a stray
      # binary of the same name would satisfy a plain `command -v`.
      ansible.builtin.shell: |
        set -eu
        pi_path="$(command -v pi 2>/dev/null || true)"
        if [ -n "$pi_path" ] && readlink -f "$pi_path" | grep -q 'pi-coding-agent'; then
          exit 0
        fi
        npm install -g --prefix "{{ npm_user_prefix }}" @earendil-works/pi-coding-agent
        echo INSTALLED
      register: pi_install
      changed_when: "'INSTALLED' in pi_install.stdout"
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Installer-script based tools. Scripts are downloaded to a temp file first
    # (so download failures are not hidden by a pipe) and removed afterwards.
    # Failures are reported but do not stop the play (ignore_errors).
    # -------------------------------------------------------------------------
    - name: Install Claude Code (native installer) if missing
      ansible.builtin.shell: |
        set -eu
        command -v claude >/dev/null 2>&1 && exit 0
        tmp="$(mktemp)"; trap 'rm -f "$tmp"' EXIT
        curl -fsSL https://claude.ai/install.sh -o "$tmp"
        bash "$tmp"
        echo INSTALLED
      register: claude_install
      changed_when: "'INSTALLED' in claude_install.stdout"
      ignore_errors: true

    - name: Install GitHub Copilot CLI if missing
      ansible.builtin.shell: |
        set -eu
        command -v copilot >/dev/null 2>&1 && exit 0
        tmp="$(mktemp)"; trap 'rm -f "$tmp"' EXIT
        curl -fsSL https://gh.io/copilot-install -o "$tmp"
        PREFIX="{{ npm_user_prefix }}" bash "$tmp"
        echo INSTALLED
      register: copilot_install
      changed_when: "'INSTALLED' in copilot_install.stdout"
      ignore_errors: true

    - name: Install Google Antigravity CLI (agy) if missing
      ansible.builtin.shell: |
        set -eu
        command -v agy >/dev/null 2>&1 && exit 0
        tmp="$(mktemp)"; trap 'rm -f "$tmp"' EXIT
        curl -fsSL https://antigravity.google/cli/install.sh -o "$tmp"
        bash "$tmp" --dir "{{ local_bin }}"
        echo INSTALLED
      register: antigravity_install
      changed_when: "'INSTALLED' in antigravity_install.stdout"
      ignore_errors: true

    - name: Install opencode if missing
      ansible.builtin.shell: |
        set -eu
        command -v opencode >/dev/null 2>&1 && exit 0
        tmp="$(mktemp)"; trap 'rm -f "$tmp"' EXIT
        curl -fsSL https://opencode.ai/install -o "$tmp"
        bash "$tmp" --no-modify-path
        echo INSTALLED
      register: opencode_install
      changed_when: "'INSTALLED' in opencode_install.stdout"
      ignore_errors: true

    - name: Check for opencode binary
      ansible.builtin.stat:
        path: "{{ user_home }}/.opencode/bin/opencode"
      register: opencode_bin

    - name: Expose opencode via ~/.local/bin (installer puts it in ~/.opencode/bin)
      ansible.builtin.file:
        src: "{{ user_home }}/.opencode/bin/opencode"
        dest: "{{ local_bin }}/opencode"
        state: link
      when: opencode_bin.stat.exists

    - name: Install herdr if missing
      ansible.builtin.shell: |
        set -eu
        command -v herdr >/dev/null 2>&1 && exit 0
        tmp="$(mktemp)"; trap 'rm -f "$tmp"' EXIT
        curl -fsSL https://herdr.dev/install.sh -o "$tmp"
        bash "$tmp"
        echo INSTALLED
      register: herdr_install
      changed_when: "'INSTALLED' in herdr_install.stdout"
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Gitea CLI (gt): pinned release binary, verified against its sha256.
    # Replaces tea, which upstream archived in favour of gt.
    # -------------------------------------------------------------------------
    - name: Check installed gt version
      ansible.builtin.command: "{{ local_bin }}/gt --version"
      register: gt_current
      changed_when: false
      failed_when: false

    - name: Install Gitea CLI (gt) {{ gt_version }}
      when: gt_version not in (gt_current.stdout | default(''))
      block:
        - name: Download gt release (checksum verified)
          ansible.builtin.get_url:
            url: "{{ gt_url }}"
            dest: "/tmp/gt-{{ gt_version }}.xz"
            checksum: "sha256:{{ gt_url }}.sha256"
            mode: '0644'

        - name: Decompress gt into ~/.local/bin
          ansible.builtin.shell: |
            set -eu
            xz -dc "/tmp/gt-{{ gt_version }}.xz" > "{{ local_bin }}/gt.new"
            chmod 0755 "{{ local_bin }}/gt.new"
            mv "{{ local_bin }}/gt.new" "{{ local_bin }}/gt"

      always:
        - name: Remove downloaded gt archive
          ansible.builtin.file:
            path: "/tmp/gt-{{ gt_version }}.xz"
            state: absent

    - name: Remove the archived tea CLI
      ansible.builtin.file:
        path: "{{ local_bin }}/tea"
        state: absent

    # -------------------------------------------------------------------------
    # Summary
    # -------------------------------------------------------------------------
    - name: Collect installed tool status
      ansible.builtin.shell: |
        for t in pi claude copilot opencode agy herdr gt gh; do
          if p="$(command -v "$t")"; then echo "$t: $(readlink -f "$p")"; else echo "$t: MISSING"; fi
        done
      register: tool_status
      changed_when: false

    - name: Show installed tool status
      ansible.builtin.debug:
        var: tool_status.stdout_lines
