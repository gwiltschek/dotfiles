---
- name: Install additional developer tools
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    user_home: "{{ lookup('env', 'HOME') }}"
    local_bin: "{{ user_home }}/.local/bin"

  tasks:
    - name: Ensure Node.js/npm are available for global CLI installs
      ansible.builtin.package:
        name:
          - nodejs
          - npm
        state: present
      become: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Ensure local bin directory exists
      ansible.builtin.file:
        path: "{{ local_bin }}"
        state: directory
        mode: '0755'

    - name: Install npm-based CLI tools into user-local prefix
      ansible.builtin.shell: |
        set -e
        export PATH="{{ local_bin }}:$PATH"
        export npm_config_prefix="{{ user_home }}/.local"

        if ! command -v pi >/dev/null 2>&1; then
          if npm view pi version >/dev/null 2>&1; then
            npm install -g pi || npm install --prefix "{{ user_home }}/.local" pi
          else
            echo "Skipping pi: package unavailable on npm"
          fi
        fi

        if ! command -v claude >/dev/null 2>&1; then
          if npm view @anthropic-ai/claude-code version >/dev/null 2>&1; then
            npm install -g @anthropic-ai/claude-code || npm install --prefix "{{ user_home }}/.local" @anthropic-ai/claude-code
          else
            echo "Skipping claude: package unavailable on npm"
          fi
        fi

        if ! command -v create-t3-app >/dev/null 2>&1; then
          if npm view create-t3-app version >/dev/null 2>&1; then
            npm install -g create-t3-app || npm install --prefix "{{ user_home }}/.local" create-t3-app
          else
            echo "Skipping create-t3-app: package unavailable on npm"
          fi
        fi

        if ! command -v antigravity >/dev/null 2>&1; then
          if npm view antigravity version >/dev/null 2>&1; then
            npm install -g antigravity || npm install --prefix "{{ user_home }}/.local" antigravity
          else
            echo "Skipping antigravity: package unavailable on npm"
          fi
        fi
      register: npm_tool_install
      changed_when: true

    - name: Install GitHub Copilot CLI if missing
      ansible.builtin.shell: |
        set -e
        export PATH="{{ local_bin }}:$PATH"
        mkdir -p "{{ local_bin }}"
        if ! command -v copilot >/dev/null 2>&1; then
          curl -fsSL https://github.com/copilot/install.sh | bash || echo "Skipping GitHub Copilot CLI: installer unavailable"
        fi
      register: copilot_install
      changed_when: true

    - name: Install opencode if its official installer provides a binary
      ansible.builtin.shell: |
        set -e
        export PATH="{{ local_bin }}:$PATH"
        mkdir -p "{{ local_bin }}"
        export PATH="{{ user_home }}/.opencode/bin:$PATH"
        if ! command -v opencode >/dev/null 2>&1; then
          # Download first: piping curl into bash hides download failures
          if curl -fsSL https://opencode.ai/install -o /tmp/opencode-install.sh; then
            bash /tmp/opencode-install.sh --no-modify-path || echo "Skipping opencode: installer failed"
          else
            echo "Skipping opencode: installer endpoint unavailable"
          fi
        fi
        # The installer puts the binary in ~/.opencode/bin; expose it via ~/.local/bin
        if [ -x "{{ user_home }}/.opencode/bin/opencode" ]; then
          ln -sf "{{ user_home }}/.opencode/bin/opencode" "{{ local_bin }}/opencode"
        fi
      register: opencode_install
      changed_when: true

    - name: Install herdr if missing and supported by its installer
      ansible.builtin.shell: |
        set -e
        export PATH="{{ local_bin }}:$PATH"
        if ! command -v herdr >/dev/null 2>&1; then
          if command -v curl >/dev/null 2>&1; then
            if curl -fsSL https://herdr.dev/install.sh >/tmp/herdr-install.sh 2>/dev/null; then
              bash /tmp/herdr-install.sh || echo "Skipping herdr: unsupported or installer failed"
            else
              echo "Skipping herdr: installer endpoint unavailable"
            fi
          else
            echo "Skipping herdr: curl not installed"
          fi
        fi
      register: herdr_install
      changed_when: true

    - name: Ensure new binaries are discoverable on PATH
      ansible.builtin.shell: |
        export PATH="{{ local_bin }}:$PATH"
        hash -r
      changed_when: false

    - name: Show installed tool status summary
      ansible.builtin.debug:
        msg:
          - "pi: {{ 'installed' if lookup('pipe', 'command -v pi || true') else 'missing' }}"
          - "opencode: {{ 'installed' if lookup('pipe', 'command -v opencode || true') else 'missing' }}"
          - "copilot: {{ 'installed' if lookup('pipe', 'command -v copilot || true') else 'missing' }}"
          - "herdr: {{ 'installed' if lookup('pipe', 'command -v herdr || true') else 'missing' }}"
          - "claude: {{ 'installed' if lookup('pipe', 'command -v claude || true') else 'missing' }}"
          - "create-t3-app: {{ 'installed' if lookup('pipe', 'command -v create-t3-app || true') else 'missing' }}"
          - "antigravity: {{ 'installed' if lookup('pipe', 'command -v antigravity || true') else 'missing' }}"
