---
- name: Complete Linux Environment Setup with Catppuccin Theme
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    target_user: "{{ ansible_facts['user_id'] }}"
    user_home: "{{ ansible_facts['env']['HOME'] }}"
    # Set to true (-e update_tools=true) to re-run installers and pull fzf updates
    update_tools: false
    nvim_dir: "nvim-linux-{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'x86_64' }}"

  tasks:
    - name: Set system timezone to Europe/Vienna
      community.general.timezone:
        name: Europe/Vienna
      become: true

    # -------------------------------------------------------------------------
    # 1. System Dependencies & Package Installation
    # -------------------------------------------------------------------------
    - name: Install system dependencies & CLI tools via apt
      apt:
        name:
          - git
          - zsh
          - curl
          - tmux
          - wget
          - unzip
          - build-essential
          - htop
          - btop
          - gh
          - plocate
          - zsh-syntax-highlighting
          - ripgrep
          - fd-find
          - gcc
          - locales
        state: present
        update_cache: yes
      become: true

    # .zshrc sets LC_ALL=en_US.UTF-8; minimal Debian/LXC images only ship C.UTF-8.
    # (On such a host the very first run needs LC_ALL=C.UTF-8, since Ansible
    # refuses to start with a missing locale.)
    - name: Generate en_US.UTF-8 locale
      community.general.locale_gen:
        name: en_US.UTF-8
        state: present
      become: true
    
    # -------------------------------------------------------------------------
    # 2. Standalone Binary Installations (Zoxide, fzf, superfile & Oh My Posh)
    # -------------------------------------------------------------------------
    # Installers only run when the tool is missing, or with -e update_tools=true.
    # Scripts are downloaded to a temp file first so download failures are not
    # hidden by a pipe.
    - name: Install zoxide, Oh My Posh and superfile
      ansible.builtin.shell: |
        set -eu
        if [ "{{ update_tools | bool }}" != "True" ] && command -v {{ item.bin }} >/dev/null 2>&1; then
          exit 0
        fi
        tmp="$(mktemp)"; trap 'rm -f "$tmp"' EXIT
        curl -fsSL {{ item.url }} -o "$tmp"
        bash "$tmp"
        echo INSTALLED
      loop:
        - { name: zoxide, bin: zoxide, url: "https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh" }
        - { name: Oh My Posh, bin: oh-my-posh, url: "https://ohmyposh.dev/install.sh" }
        - { name: superfile, bin: spf, url: "https://superfile.dev/install.sh" }
      loop_control:
        label: "{{ item.name }}"
      register: script_installs
      changed_when: "'INSTALLED' in script_installs.stdout"
      environment:
        PATH: "{{ user_home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"

    - name: Clone fzf repository
      ansible.builtin.git:
        repo: https://github.com/junegunn/fzf.git
        dest: "{{ user_home }}/.fzf"
        depth: 1
        version: master
        update: "{{ update_tools | bool }}"
      register: fzf_repo

    - name: Run fzf installer
      ansible.builtin.command:
        cmd: "{{ user_home }}/.fzf/install --all"
        # Re-run after a repo update so the binary matches the new source
        creates: "{{ omit if fzf_repo.changed else user_home + '/.fzf/bin/fzf' }}"

    # -------------------------------------------------------------------------
    # 3. Directory Structure Setup
    # -------------------------------------------------------------------------
    - name: Ensure ~/.config subdirectories exist
      file:
        path: "{{ user_home }}/.config/{{ item }}"
        state: directory
        owner: "{{ target_user }}"
        mode: '0755'
      loop:
        - nvim
        - btop/themes
        - htop

    # -------------------------------------------------------------------------
    # 4. Neovim & AstroVim (Catppuccin Integration)
    # -------------------------------------------------------------------------
    # Neovim tracks the latest release, but only downloads when the version changed
    - name: Get latest Neovim release
      ansible.builtin.uri:
        url: https://api.github.com/repos/neovim/neovim/releases/latest
        return_content: true
      register: nvim_latest

    - name: Get installed Neovim version
      ansible.builtin.command: "/opt/{{ nvim_dir }}/bin/nvim --version"
      register: nvim_installed
      changed_when: false
      failed_when: false

    - name: Install Neovim {{ nvim_latest.json.tag_name }}
      when: >-
        nvim_installed.rc != 0
        or ('NVIM ' + nvim_latest.json.tag_name) not in nvim_installed.stdout_lines[0]
      become: true
      block:
        - name: Download Neovim tarball
          ansible.builtin.get_url:
            url: "https://github.com/neovim/neovim/releases/download/{{ nvim_latest.json.tag_name }}/{{ nvim_dir }}.tar.gz"
            dest: "/tmp/{{ nvim_dir }}.tar.gz"
            mode: '0644'

        - name: Remove previous Neovim installation
          ansible.builtin.file:
            path: "/opt/{{ nvim_dir }}"
            state: absent

        - name: Unpack Neovim to /opt
          ansible.builtin.unarchive:
            src: "/tmp/{{ nvim_dir }}.tar.gz"
            dest: /opt
            remote_src: true

      always:
        - name: Clean up downloaded tarball
          ansible.builtin.file:
            path: "/tmp/{{ nvim_dir }}.tar.gz"
            state: absent

    - name: Ensure nvim is in system PATH
      ansible.builtin.file:
        src: "/opt/{{ nvim_dir }}/bin/nvim"
        dest: /usr/local/bin/nvim
        state: link
      become: true

    - name: Clone AstroVim template repository
      git:
        repo: 'https://github.com/AstroNvim/template'
        dest: "{{ user_home }}/.config/nvim"
        depth: 1
        update: no
      ignore_errors: true

    - name: Configure AstroCommunity imports in community.lua
      copy:
        dest: "{{ user_home }}/.config/nvim/lua/community.lua"
        owner: "{{ target_user }}"
        mode: '0644'
        content: |
          return {
            "AstroNvim/astrocommunity",
            { import = "astrocommunity.colorscheme.catppuccin" },
          }

    - name: Set Catppuccin Mocha as default colorscheme in astroui.lua
      copy:
        dest: "{{ user_home }}/.config/nvim/lua/plugins/astroui.lua"
        owner: "{{ target_user }}"
        mode: '0644'
        content: |
          return {
            "AstroNvim/astroui",
            ---@type AstroUIOpts
            opts = {
              colorscheme = "catppuccin-mocha",
            },
          }

    # -------------------------------------------------------------------------
    # 5. btop & htop Themes (Catppuccin Mocha)
    # -------------------------------------------------------------------------
    - name: Download Catppuccin theme for btop
      get_url:
        url: https://raw.githubusercontent.com/catppuccin/btop/main/themes/catppuccin_mocha.theme
        dest: "{{ user_home }}/.config/btop/themes/catppuccin_mocha.theme"
        owner: "{{ target_user }}"
        mode: '0644'

    # Edit single lines: btop writes its full config on exit, so replacing the
    # whole file would undo that on every run.
    - name: Set Catppuccin theme in btop config
      ansible.builtin.lineinfile:
        path: "{{ user_home }}/.config/btop/btop.conf"
        regexp: "^{{ item.key }}\\s*="
        line: "{{ item.key }} = {{ item.value }}"
        create: true
        owner: "{{ target_user }}"
        mode: '0644'
      loop:
        - { key: color_theme, value: '"catppuccin_mocha"' }
        - { key: theme_background, value: 'False' }

    # -------------------------------------------------------------------------
    # 6. Zsh, fzf & Oh My Posh Setup (Zen + Catppuccin)
    # -------------------------------------------------------------------------
    - name: Set Zsh as default shell
      user:
        name: "{{ target_user }}"
        shell: /bin/zsh
      become: true

    - name: Authorize SSH public key from Windows machine
      # Adds the key without touching other entries in authorized_keys
      ansible.posix.authorized_key:
        user: "{{ target_user }}"
        key: "{{ lookup('file', playbook_dir + '/keys/windows.pub') }}"
        state: present

    - name: ensures {{ user_home }}/.ompthemes dir exists
      file: 
        path: "{{ user_home }}/.ompthemes"
        state: directory

    - name: Get Oh My Posh Theme from github
      get_url:
        url: https://raw.githubusercontent.com/gwiltschek/dotfiles/refs/heads/main/zen.toml
        dest: "{{user_home}}/.ompthemes/zen.toml"
        owner: "{{ target_user }}"
        mode: '0644'

    - name: Write ~/.zshrc configuration
      blockinfile:
        path: "{{ user_home }}/.zshrc"
        create: yes
        owner: "{{ target_user }}"
        mode: '0644'
        block: |
          autoload -U compinit && compinit
          
          # Environment Variables & Aliases
          export PATH="$HOME/.local/bin:$PATH"

          # NVIM
          export EDITOR="nvim"
          alias vim="nvim"
          alias vi="nvim"
          alias oldvim="vim"

          # auto completion
          zstyle ':completion:*' special-dirs ..
          source /usr/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh
          
          # zoxide
          eval "$(zoxide init zsh)"

          # omp
          eval "$(oh-my-posh init zsh --config '~/.ompthemes/zen.toml')"
          
          # Initialize fzf keybindings and completion
          [ -f /usr/share/doc/fzf/examples/key-bindings.zsh ] && source /usr/share/doc/fzf/examples/key-bindings.zsh
          [ -f /usr/share/doc/fzf/examples/completion.zsh ] && source /usr/share/doc/fzf/examples/completion.zsh
          
          # fzf Catppuccin Mocha Theme (compatible with all fzf versions)
          export FZF_DEFAULT_OPTS=" \
          --color=bg+:#313244,bg:#1e1e2e,spinner:#f5e0dc,hl:#f38ba8 \
          --color=fg:#cdd6f4,header:#f38ba8,info:#cba6f7,pointer:#f5e0dc \
          --color=marker:#b4befe,fg+:#cdd6f4,prompt:#cba6f7,hl+:#f38ba8"

          ## History file configuration
          [ -z "$HISTFILE" ] && HISTFILE="$HOME/.zsh_history"
          [ "$HISTSIZE" -lt 50000 ] && HISTSIZE=50000
          [ "$SAVEHIST" -lt 10000 ] && SAVEHIST=10000

          ## History command configuration
          setopt extended_history       # record timestamp of command in HISTFILE
          setopt hist_expire_dups_first # delete duplicates first when HISTFILE size exceeds HISTSIZE
          setopt hist_ignore_dups       # ignore duplicated commands history list
          setopt hist_ignore_space      # ignore commands that start with space
          setopt hist_verify            # show command with history expansion to user before running it
          setopt share_history          # share command history data

          export SUDO_EDITOR=nvim
          [ -f ~/.fzf.zsh ] && source ~/.fzf.zsh
          export LC_ALL=en_US.UTF-8
    
    - name: Write ~/.tmux.conf configuration
      blockinfile:
        path: "{{ user_home }}/.tmux.conf"
        create: yes
        owner: "{{ target_user }}"
        mode: '0644'
        block: |
          # only show status bar if there is more then one window
          set -g status off
          set-hook -g after-new-window      'if "[ #{session_windows} -gt 1 ]" "set status on"'
          set-hook -g after-kill-pane       'if "[ #{session_windows} -lt 2 ]" "set status off"'
          set-hook -g pane-exited           'if "[ #{session_windows} -lt 2 ]" "set status off"'
          set-hook -g window-layout-changed 'if "[ #{session_windows} -lt 2 ]" "set status off"'
 
